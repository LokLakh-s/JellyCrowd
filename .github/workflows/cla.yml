name: CLA

# Asks a first-time contributor to sign the CLA on their pull request, records the signature in this
# repository, and re-checks on every later push to the PR.
#
# `pull_request_target` runs with this repository's token rather than the fork's, which is what lets the
# bot comment and commit. That trigger is dangerous when a workflow checks out and RUNS the pull
# request's code — this one never checks the PR out at all, it only reads its metadata. Keep it that way.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write      # the signature file lives in this repository
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          || github.event_name == 'pull_request_target'
        # Pinned to a commit: this action holds a token that can write to the repository.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/LokLakh-s/JellyCrowd/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: main
          # Bots author no copyright, so there is nothing for them to license: Dependabot's dependency
          # bumps would otherwise sit blocked forever waiting on a signature nobody can give.
          # Trailing wildcards, and NOT the literal logins: the allowlist is glob-matched, so the
          # brackets in "dependabot[bot]" are read as a character class — that entry matches
          # "dependabotb", "dependaboto" and "dependabott", and never the account it names. Measured
          # on PR #1, which the bot blocked while supposedly allowlisted.
          allowlist: LokLakh-s,dependabot*,github-actions*,renovate*
          custom-notsigned-prcomment: >-
            Thanks for this pull request. Jelly Crowd asks contributors to sign its
            [Contributor License Agreement](https://github.com/LokLakh-s/JellyCrowd/blob/main/CLA.md)
            before a change can be merged. **You keep the copyright on what you wrote** — the agreement
            grants a sublicensable licence, which is what lets the project change its own licence later
            without having to track down every contributor. It takes one comment:
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thanks — on to the review.
