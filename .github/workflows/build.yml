name: CI

# Runs on pull requests and manual dispatch only. Pushes to `main` are handled by the Release workflow,
# which builds and runs the full test suite before publishing — so a separate CI run on main-push would
# just duplicate that work (both queued on the single self-hosted runner).
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

defaults:
  run:
    working-directory: JellyCrowd

jobs:
  build-test:
    name: Build & Test
    # Self-hosted runner ("JellyCrowd") to save GitHub-hosted minutes. ~/.nuget and the tool cache
    # persist between runs on the runner host, so no actions/cache round-trip is needed.
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner isn't root: install the .NET SDK into the writable, persistent tool cache
      # instead of the default /usr/share/dotnet (which fails with "Permission denied").
      - name: Configure .NET install dir
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TOOL_CACHE/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (.NET)
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Test (JS)
        run: |
          (cd tests/js && npm ci)
          node --test tests/js/*.test.js

      # Boots a REAL Jellyfin with this build and asserts what unit tests structurally cannot: that the
      # plugin loads, its services resolve out of Jellyfin's DI, its scheduled tasks register, its routes
      # answer, its authorization holds against an actual non-admin user, and its web shell is injected.
      # Needs docker on the runner; skipped (not failed) when there is none.
      - name: Test (E2E, real Jellyfin)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::warning::docker unavailable on this runner — skipping the E2E check"
            exit 0
          fi
          ./tests/e2e/run-e2e.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 7

      - name: Package plugin
        run: |
          mkdir -p artifacts
          # Copy the plugin and its bundled runtime dependencies (MailKit/MimeKit/BouncyCastle);
          # host-provided assemblies are ExcludeAssets=runtime and absent from the output.
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/*.dll artifacts/
          cp Jellyfin.Plugin.JellyCrowd.Segments/bin/Release/net9.0/Jellyfin.Plugin.JellyCrowd.Segments.dll artifacts/
          cp build.yaml artifacts/
          cd artifacts && zip jelly-crowd.zip *.dll build.yaml

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jelly-crowd-plugin
          path: JellyCrowd/artifacts/jelly-crowd.zip
          retention-days: 7

      # Keep the self-hosted runner's disk from growing: drop build outputs and the NuGet
      # http/temp caches (the bounded global-packages cache is kept for fast restores).
      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf Jellyfin.Plugin.JellyCrowd/bin Jellyfin.Plugin.JellyCrowd/obj \
                 Jellyfin.Plugin.JellyCrowd.Tests/bin Jellyfin.Plugin.JellyCrowd.Tests/obj \
                 artifacts
          # `dotnet nuget locals` takes a single location at a time; clear each separately (keep
          # global-packages so restores stay warm).
          dotnet nuget locals http-cache --clear || true
          dotnet nuget locals temp --clear || true
