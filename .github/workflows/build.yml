name: CI

# Pull requests, pushes to `main`, and manual dispatch. Release builds and tests on a main push too, so
# the unit suites do run twice there — accepted on purpose: Release has no E2E step and the E2E lives
# here, so without this trigger a direct push to `main` publishes without a single Jellyfin ever being
# booted. The automated `chore(release):` commit carries [skip ci], so a release does not bounce back
# into this workflow. Mind that marker anywhere in a commit message, subject or body: GitHub reads the
# whole message and suppresses every workflow for that push, this one included.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# Least privilege: this workflow only ever reads the tree. Without the block it inherits the repository
# default, which on a public repo may still be read/write for the GITHUB_TOKEN.
permissions:
  contents: read

defaults:
  run:
    working-directory: JellyCrowd

jobs:
  build-test:
    name: Build & Test
    # GitHub-hosted, always. A pull request carries code nobody has reviewed — on a public repository,
    # from anyone — and a self-hosted runner would hand that code execution on a personal machine, with
    # its persistent caches and its docker socket. A throwaway VM has nothing to keep and nothing to
    # reach; minutes are free and unmetered on a public repository.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          # Both: the plugin and its 10.11 companion are net9.0, while the Jellyfin 12 companion must be
          # net10.0 (Jellyfin.Controller 12.x ships lib/net10.0 only). The net9 SDK stays listed because the
          # test host runs on net9.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (.NET)
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Test (JS)
        run: |
          (cd tests/js && npm ci)
          node --test tests/js/*.test.js

      # Boots a REAL Jellyfin with this build and asserts what unit tests structurally cannot: that the
      # plugin loads, its services resolve out of Jellyfin's DI, its scheduled tasks register, its routes
      # answer, its authorization holds against an actual non-admin user, and its web shell is injected.
      # Needs docker on the runner, and treats its absence as a failure: this step sat silently green for
      # weeks because the runner user was not in the `docker` group, so the check never actually ran. A
      # skip that nobody sees is worse than no check at all.
      # Both supported majors, from the one build: a single artifact is published for 12 and 10.11 alike,
      # so a break on either is a break in what we ship. 12 runs first — it is the announced target, and
      # it is the one that catches a companion assembly slipping back under a scanned name, where the
      # host disables the whole plugin. 10.11 follows: it is still supported, so it still gates a release.
      - name: Test (E2E, real Jellyfin)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::docker is unreachable from this runner — the E2E check cannot run. Check that $(id -un) is in the docker group."
            exit 1
          fi
          rc=0
          for image in jellyfin/jellyfin:12.1 jellyfin/jellyfin:10.11; do
            echo "::group::E2E against $image"
            JF_IMAGE="$image" ./tests/e2e/run-e2e.sh || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 7

      - name: Package plugin
        run: |
          mkdir -p artifacts
          # Copy the plugin and its bundled runtime dependencies (MailKit/MimeKit/BouncyCastle);
          # host-provided assemblies are ExcludeAssets=runtime and absent from the output.
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/*.dll artifacts/
          # Both companion halves, as lib/*.dll.bin — see the Package step in release.yml for why.
          mkdir -p artifacts/lib
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/lib/*.dll.bin artifacts/lib/
          cp build.yaml artifacts/
          cd artifacts && zip jelly-crowd.zip *.dll build.yaml lib/*.bin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: jelly-crowd-plugin
          path: JellyCrowd/artifacts/jelly-crowd.zip
          retention-days: 7
