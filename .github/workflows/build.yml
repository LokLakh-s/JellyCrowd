name: CI

# Pull requests, pushes to `main`, and manual dispatch. Release builds and tests on a main push too, so
# the unit suites do run twice there — accepted on purpose: Release has no E2E step and the E2E lives
# here, so without this trigger a direct push to `main` publishes without a single Jellyfin ever being
# booted. Both queue on the one self-hosted runner, so they never race over the E2E container or the
# build output. The automated `chore(release):` commit carries [skip ci], so a release does not bounce
# back into this workflow. Mind that marker anywhere in a commit message, subject or body: GitHub reads
# the whole message and suppresses every workflow for that push, this one included.
on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

defaults:
  run:
    working-directory: JellyCrowd

jobs:
  build-test:
    name: Build & Test
    # Self-hosted runner ("JellyCrowd") to save GitHub-hosted minutes. ~/.nuget and the tool cache
    # persist between runs on the runner host, so no actions/cache round-trip is needed.
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The runner isn't root: install the .NET SDK into the writable, persistent tool cache
      # instead of the default /usr/share/dotnet (which fails with "Permission denied").
      - name: Configure .NET install dir
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TOOL_CACHE/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          # Both: the plugin and its 10.11 companion are net9.0, while the Jellyfin 12 companion must be
          # net10.0 (Jellyfin.Controller 12.x ships lib/net10.0 only). The net9 SDK stays listed because the
          # test host runs on net9.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (.NET)
        run: dotnet test --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Test (JS)
        run: |
          (cd tests/js && npm ci)
          node --test tests/js/*.test.js

      # Boots a REAL Jellyfin with this build and asserts what unit tests structurally cannot: that the
      # plugin loads, its services resolve out of Jellyfin's DI, its scheduled tasks register, its routes
      # answer, its authorization holds against an actual non-admin user, and its web shell is injected.
      # Needs docker on the runner, and treats its absence as a failure: this step sat silently green for
      # weeks because the runner user was not in the `docker` group, so the check never actually ran. A
      # skip that nobody sees is worse than no check at all.
      # Both supported majors, from the one build: a single artifact is published for 10.11 and 12 alike,
      # so a break on either is a break in what we ship. 12 is the one that catches a companion assembly
      # slipping back under a scanned name — there, the host disables the whole plugin.
      - name: Test (E2E, real Jellyfin)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::docker is unreachable from this runner — the E2E check cannot run. Check that $(id -un) is in the docker group."
            exit 1
          fi
          rc=0
          for image in jellyfin/jellyfin:10.11 jellyfin/jellyfin:12.1; do
            echo "::group::E2E against $image"
            JF_IMAGE="$image" ./tests/e2e/run-e2e.sh || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
          retention-days: 7

      - name: Package plugin
        run: |
          mkdir -p artifacts
          # Copy the plugin and its bundled runtime dependencies (MailKit/MimeKit/BouncyCastle);
          # host-provided assemblies are ExcludeAssets=runtime and absent from the output.
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/*.dll artifacts/
          # Both companion halves, as lib/*.dll.bin — see the Package step in release.yml for why.
          mkdir -p artifacts/lib
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/lib/*.dll.bin artifacts/lib/
          cp build.yaml artifacts/
          cd artifacts && zip jelly-crowd.zip *.dll build.yaml lib/*.bin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: jelly-crowd-plugin
          path: JellyCrowd/artifacts/jelly-crowd.zip
          retention-days: 7

      # Keep the self-hosted runner's disk from growing: drop build outputs and the NuGet
      # http/temp caches (the bounded global-packages cache is kept for fast restores).
      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf Jellyfin.Plugin.JellyCrowd/bin Jellyfin.Plugin.JellyCrowd/obj \
                 Jellyfin.Plugin.JellyCrowd.Tests/bin Jellyfin.Plugin.JellyCrowd.Tests/obj \
                 artifacts
          # `dotnet nuget locals` takes a single location at a time; clear each separately (keep
          # global-packages so restores stay warm).
          dotnet nuget locals http-cache --clear || true
          dotnet nuget locals temp --clear || true
