name: Release

# Automatic 4-part versioning (major.minor.patch.revision) driven by a keyword in the commit message:
#   [major]    / #major                   -> bump MAJOR    (x+1.0.0.0)
#   [minor]    / #minor                    -> bump MINOR    (x.y+1.0.0)
#   [revision] / #revision / [hotfix] / [build] -> bump REVISION (x.y.z.w+1) — stay on the x.y.z line
#   anything else                          -> bump PATCH    (x.y.z+1.0)
# Skip a release entirely with [skip release] in the commit message.
#
# Source stays in this (private) repo; the plugin ZIP + install manifest are published to the PUBLIC
# distribution repo LokLakh-s/jellycrowd-dist via the DIST_TOKEN secret (a fine-grained PAT with
# Contents: Read and write on that repo).

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: JellyCrowd

env:
  DIST_REPO: LokLakh-s/jellycrowd-dist

jobs:
  release:
    name: Version & Release
    runs-on: [self-hosted]
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):')
          && !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure .NET install dir
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TOOL_CACHE/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine next version
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then base="0.1.0.0"; else base="${latest#v}"; fi
          IFS='.' read -r major minor patch revision <<< "$base"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}; revision=${revision:-0}
          if printf '%s' "$COMMIT_MSG" | grep -qiE '\[major\]|#major'; then
            major=$((major+1)); minor=0; patch=0; revision=0
          elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[minor\]|#minor'; then
            minor=$((minor+1)); patch=0; revision=0
          elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[revision\]|#revision|\[hotfix\]|\[build\]'; then
            revision=$((revision+1))
          else
            patch=$((patch+1)); revision=0
          fi
          version="${major}.${minor}.${patch}.${revision}"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "assembly=$version"  >> "$GITHUB_OUTPUT"
          echo "tag=v$version"      >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Abort if tag already exists
        run: |
          if git rev-parse "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists."; exit 1
          fi

      - name: Stamp version into source files
        run: |
          set -euo pipefail
          asm="${{ steps.bump.outputs.assembly }}"
          sed -i -E "s|<Version>[^<]*</Version>|<Version>${asm}</Version>|" Directory.Build.props
          sed -i -E "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>${asm}</AssemblyVersion>|" Directory.Build.props
          sed -i -E "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>${asm}</FileVersion>|" Directory.Build.props
          sed -i -E "s|^version: .*|version: \"${asm}\"|" build.yaml

      - name: Restore, build & test
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build --verbosity normal
          (cd tests/js && npm ci)
          node --test tests/js/*.test.js

      - name: Package plugin
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/*.dll artifacts/
          cp build.yaml artifacts/
          zipname="jelly-crowd-${{ steps.bump.outputs.tag }}.zip"
          (cd artifacts && zip "$zipname" *.dll build.yaml && md5sum "$zipname" > "$zipname.md5")

      - name: Commit version bump and tag (source repo)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JellyCrowd/Directory.Build.props JellyCrowd/build.yaml
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          # Annotated tag + explicit push: the version counter (git tag --list) lives in THIS repo, and
          # `--follow-tags` only pushes annotated tags — a lightweight tag would never reach the remote,
          # leaving the next run to recompute the same version and fail on an empty bump commit.
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}"

      - name: Publish release to the distribution repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          files: |
            JellyCrowd/artifacts/jelly-crowd-*.zip
            JellyCrowd/artifacts/jelly-crowd-*.zip.md5

      - name: Update the distribution manifest
        working-directory: ${{ github.workspace }}
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          asm="${{ steps.bump.outputs.assembly }}"
          guid="a1994160-4ea2-4d81-bd3c-ffe825700d98"
          zipname="jelly-crowd-${tag}.zip"
          checksum=$(md5sum "JellyCrowd/artifacts/${zipname}" | cut -d' ' -f1)
          sourceUrl="https://github.com/${DIST_REPO}/releases/download/${tag}/${zipname}"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)
          rm -rf "${RUNNER_TEMP}/dist-repo"
          git clone "https://x-access-token:${DIST_TOKEN}@github.com/${DIST_REPO}.git" "${RUNNER_TEMP}/dist-repo"
          cd "${RUNNER_TEMP}/dist-repo"
          entry=$(jq -n \
            --arg v "$asm" \
            --arg c "Release ${tag}" \
            --arg abi "10.11.0.0" \
            --arg url "$sourceUrl" \
            --arg sum "$checksum" \
            --arg ts "$timestamp" \
            '{version: $v, changelog: $c, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}')
          jq --argjson e "$entry" --arg guid "$guid" \
            'map(if .guid == $guid then .versions = (([$e] + (.versions // [])) | .[0:3]) else . end)' \
            manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Release ${tag}" || echo "manifest unchanged"
          git push origin HEAD:main

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf Jellyfin.Plugin.JellyCrowd/bin Jellyfin.Plugin.JellyCrowd/obj \
                 Jellyfin.Plugin.JellyCrowd.Tests/bin Jellyfin.Plugin.JellyCrowd.Tests/obj \
                 artifacts
          rm -rf "${RUNNER_TEMP}/dist-repo" || true
          dotnet nuget locals http-cache temp --clear || true
