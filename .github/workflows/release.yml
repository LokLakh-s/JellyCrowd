name: Release

# Automatic semantic versioning driven by a keyword in the commit message:
#   [major] / #major  -> bump MAJOR (x+1.0.0)
#   [minor] / #minor  -> bump MINOR (x.y+1.0)
#   anything else     -> bump PATCH (x.y.z+1)
# Skip a release entirely with [skip release] in the commit message.

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: JellyCrowd

jobs:
  release:
    name: Version & Release
    # Self-hosted runner ("JellyCrowd") to save GitHub-hosted minutes.
    runs-on: [self-hosted]
    # Don't loop on the bot's own "chore(release):" bump commit, and honor [skip release].
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):')
          && !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine next version
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then base="0.1.0"; else base="${latest#v}"; fi
          IFS='.' read -r major minor patch <<< "$base"
          if printf '%s' "$COMMIT_MSG" | grep -qiE '\[major\]|#major'; then
            major=$((major+1)); minor=0; patch=0
          elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[minor\]|#minor'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          version="${major}.${minor}.${patch}"
          assembly="${version}.0"
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "assembly=$assembly" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"      >> "$GITHUB_OUTPUT"
          echo "Next version: $version (assembly $assembly)"

      - name: Abort if tag already exists
        run: |
          if git rev-parse "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists."; exit 1
          fi

      - name: Stamp version into source files
        run: |
          set -euo pipefail
          asm="${{ steps.bump.outputs.assembly }}"
          sed -i -E "s|<Version>[^<]*</Version>|<Version>${asm}</Version>|" Directory.Build.props
          sed -i -E "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>${asm}</AssemblyVersion>|" Directory.Build.props
          sed -i -E "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>${asm}</FileVersion>|" Directory.Build.props
          sed -i -E "s|^version: .*|version: \"${asm}\"|" build.yaml

      - name: Restore, build & test
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build --verbosity normal
          node --test tests/js/*.test.js

      - name: Package plugin
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Plugin + bundled runtime deps (MailKit/MimeKit/BouncyCastle); host-provided assemblies
          # are ExcludeAssets=runtime and absent from the output.
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/*.dll artifacts/
          cp build.yaml artifacts/
          zipname="jelly-crowd-${{ steps.bump.outputs.tag }}.zip"
          (cd artifacts && zip "$zipname" *.dll build.yaml && md5sum "$zipname" > "$zipname.md5")

      - name: Update repository manifest
        # The repository manifest lives at the repo root (one manifest for all plugins in this
        # monorepo). Update only the Jelly Crowd entry, matched by guid, and keep the 3 newest
        # versions so the manifest stays small.
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          asm="${{ steps.bump.outputs.assembly }}"
          guid="a1994160-4ea2-4d81-bd3c-ffe825700d98"
          zipname="jelly-crowd-${tag}.zip"
          manifest="${GITHUB_WORKSPACE}/manifest.json"
          checksum=$(md5sum "artifacts/${zipname}" | cut -d' ' -f1)
          sourceUrl="https://github.com/LokLakh-s/jellyfin-plugins/releases/download/${tag}/${zipname}"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)
          entry=$(jq -n \
            --arg v "$asm" \
            --arg c "Release ${tag}" \
            --arg abi "10.11.0.0" \
            --arg url "$sourceUrl" \
            --arg sum "$checksum" \
            --arg ts "$timestamp" \
            '{version: $v, changelog: $c, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}')
          jq --argjson e "$entry" --arg guid "$guid" \
            'map(if .guid == $guid then .versions = (([$e] + (.versions // [])) | .[0:3]) else . end)' \
            "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: Commit version bump and tag
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JellyCrowd/Directory.Build.props JellyCrowd/build.yaml manifest.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            JellyCrowd/artifacts/jelly-crowd-*.zip
            JellyCrowd/artifacts/jelly-crowd-*.zip.md5

      # Keep the self-hosted runner's disk from growing.
      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf Jellyfin.Plugin.JellyCrowd/bin Jellyfin.Plugin.JellyCrowd/obj \
                 Jellyfin.Plugin.JellyCrowd.Tests/bin Jellyfin.Plugin.JellyCrowd.Tests/obj \
                 artifacts
          dotnet nuget locals http-cache temp --clear || true
