name: Release

# Automatic 4-part versioning (major.minor.patch.revision) driven by a keyword in the commit message:
#   [major]    / #major                   -> bump MAJOR    (x+1.0.0.0)
#   [minor]    / #minor                    -> bump MINOR    (x.y+1.0.0)
#   [revision] / #revision / [hotfix] / [build] -> bump REVISION (x.y.z.w+1) — stay on the x.y.z line
#   anything else                          -> bump PATCH    (x.y.z+1.0)
# Skip a release entirely with [skip release] in the commit message.
#
# Source stays in this (private) repo; the plugin ZIP + install manifest + README/screenshots (from dist/)
# are published to the PUBLIC distribution repo LokLakh-s/JellyCrowd via the DIST_TOKEN secret (a
# fine-grained PAT with Contents: Read and write on that repo). The public repo is force-pushed to a
# single clean commit each release, so it never accumulates history.

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: JellyCrowd

env:
  DIST_REPO: LokLakh-s/JellyCrowd

jobs:
  release:
    name: Version & Release
    runs-on: [self-hosted]
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release):')
          && !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure .NET install dir
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TOOL_CACHE/dotnet" >> "$GITHUB_ENV"

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine next version
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Explicit override (used for the beta reset): [version=X.Y.Z.W] pins the exact version and
          # bypasses the tag-based bump. Everything downstream (tag, stamp, manifest) uses it verbatim.
          # `|| true`: grep exits non-zero when there's no [version=] tag, which would abort the step
          # under `set -euo pipefail` and fail every normal (non-override) release.
          override=$(printf '%s' "$COMMIT_MSG" | grep -oiE '\[version=[0-9.]+\]' | head -n1 | tr -dc '0-9.' || true)
          if [ -n "$override" ]; then
            version="$override"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
            if [ -z "$latest" ]; then base="0.1.0.0"; else base="${latest#v}"; fi
            IFS='.' read -r major minor patch revision <<< "$base"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}; revision=${revision:-0}
            if printf '%s' "$COMMIT_MSG" | grep -qiE '\[major\]|#major'; then
              major=$((major+1)); minor=0; patch=0; revision=0
            elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[minor\]|#minor'; then
              minor=$((minor+1)); patch=0; revision=0
            elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[revision\]|#revision|\[hotfix\]|\[build\]'; then
              revision=$((revision+1))
            else
              patch=$((patch+1)); revision=0
            fi
            version="${major}.${minor}.${patch}.${revision}"
          fi
          # History reset: fresh manifest (this version only) + wipe of prior public releases/tags.
          if printf '%s' "$COMMIT_MSG" | grep -qiE '\[reset-history\]'; then reset=1; else reset=0; fi
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "assembly=$version"  >> "$GITHUB_OUTPUT"
          echo "tag=v$version"      >> "$GITHUB_OUTPUT"
          echo "reset=$reset"       >> "$GITHUB_OUTPUT"
          echo "Next version: $version (reset=$reset)"

      - name: Abort if tag already exists
        run: |
          if git rev-parse "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists."; exit 1
          fi

      - name: Stamp version into source files
        run: |
          set -euo pipefail
          asm="${{ steps.bump.outputs.assembly }}"
          sed -i -E "s|<Version>[^<]*</Version>|<Version>${asm}</Version>|" Directory.Build.props
          sed -i -E "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>${asm}</AssemblyVersion>|" Directory.Build.props
          sed -i -E "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>${asm}</FileVersion>|" Directory.Build.props
          sed -i -E "s|^version: .*|version: \"${asm}\"|" build.yaml

      - name: Restore, build & test
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build --verbosity normal
          (cd tests/js && npm ci)
          node --test tests/js/*.test.js

      - name: Package plugin
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/*.dll artifacts/
          # The isolated Skip Outro companion assembly (not in build.yaml artifacts, so Jellyfin never
          # scans it — kept out of harm's way on a newer Jellyfin — but bundled so the plugin can load it).
          cp Jellyfin.Plugin.JellyCrowd.Segments/bin/Release/net9.0/Jellyfin.Plugin.JellyCrowd.Segments.dll artifacts/
          cp build.yaml artifacts/
          zipname="jelly-crowd-${{ steps.bump.outputs.tag }}.zip"
          (cd artifacts && zip "$zipname" *.dll build.yaml && md5sum "$zipname" > "$zipname.md5")

      - name: Commit version bump and tag (source repo)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JellyCrowd/Directory.Build.props JellyCrowd/build.yaml
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          # Annotated tag + explicit push: the version counter (git tag --list) lives in THIS repo, and
          # `--follow-tags` only pushes annotated tags — a lightweight tag would never reach the remote,
          # leaving the next run to recompute the same version and fail on an empty bump commit.
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}"

      - name: Publish release to the distribution repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_TOKEN }}
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          files: |
            JellyCrowd/artifacts/jelly-crowd-*.zip
            JellyCrowd/artifacts/jelly-crowd-*.zip.md5

      - name: Publish the distribution repo (single clean commit)
        working-directory: ${{ github.workspace }}
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          asm="${{ steps.bump.outputs.assembly }}"
          guid="a1994160-4ea2-4d81-bd3c-ffe825700d98"
          zipname="jelly-crowd-${tag}.zip"
          checksum=$(md5sum "JellyCrowd/artifacts/${zipname}" | cut -d' ' -f1)
          sourceUrl="https://github.com/${DIST_REPO}/releases/download/${tag}/${zipname}"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)

          # Read the current manifest from the distribution repo so the version history is preserved
          # (git history is not — the public repo is kept to a single commit, see below).
          rm -rf "${RUNNER_TEMP}/dist-repo"
          git clone --depth 1 "https://x-access-token:${DIST_TOKEN}@github.com/${DIST_REPO}.git" "${RUNNER_TEMP}/dist-repo"
          entry=$(jq -n \
            --arg v "$asm" \
            --arg c "Release ${tag}" \
            --arg abi "10.11.0.0" \
            --arg url "$sourceUrl" \
            --arg sum "$checksum" \
            --arg ts "$timestamp" \
            '{version: $v, changelog: $c, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}')
          # Normal release: keep the 3 newest versions. History reset: publish ONLY this version.
          jq --argjson e "$entry" --arg guid "$guid" --arg reset "${{ steps.bump.outputs.reset }}" \
            'map(if .guid == $guid then .versions = (if $reset == "1" then [$e] else (([$e] + (.versions // [])) | .[0:3]) end) else . end)' \
            "${RUNNER_TEMP}/dist-repo/manifest.json" > "${RUNNER_TEMP}/manifest.json"

          # Assemble the public repo: updated manifest + the distribution assets kept in THIS (private)
          # repo under dist/ (README, screenshots, logo, LICENSE). Force-push a single commit so the public
          # history is always exactly one clean commit — no accumulated release history, ever.
          staging="${RUNNER_TEMP}/dist-staging"
          rm -rf "$staging"; mkdir -p "$staging"
          cp "${RUNNER_TEMP}/manifest.json" "$staging/manifest.json"
          cp -r dist/. "$staging/"
          cd "$staging"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jelly Crowd ${tag}"
          git push -f "https://x-access-token:${DIST_TOKEN}@github.com/${DIST_REPO}.git" HEAD:main

      - name: Reset public releases & tags (history wipe)
        if: steps.bump.outputs.reset == '1'
        working-directory: ${{ github.workspace }}
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          # Best-effort (no `set -e`): the release + manifest are already published, so a wipe hiccup must
          # never fail the ship. Delete every public GitHub Release and tag EXCEPT the one just published.
          set -uo pipefail
          keep="${{ steps.bump.outputs.tag }}"
          api="https://api.github.com/repos/${DIST_REPO}"
          auth=(-H "Authorization: Bearer ${DIST_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "Wiping public releases & tags except ${keep}"
          # Collect all release ids across pages BEFORE deleting (deleting shifts pagination).
          ids=""; page=1
          while :; do
            rels=$(curl -fsS "${auth[@]}" "${api}/releases?per_page=100&page=${page}" || echo '[]')
            n=$(printf '%s' "$rels" | jq 'length'); [ "$n" -eq 0 ] && break
            ids="$ids $(printf '%s' "$rels" | jq -r --arg keep "$keep" '.[] | select(.tag_name != $keep) | .id')"
            page=$((page+1))
          done
          for id in $ids; do
            echo "  delete release id=$id"
            curl -fsS -X DELETE "${auth[@]}" "${api}/releases/${id}" || echo "    (release $id delete failed; continuing)"
          done
          # Collect all tag names across pages, then delete each ref.
          names=""; page=1
          while :; do
            tags=$(curl -fsS "${auth[@]}" "${api}/tags?per_page=100&page=${page}" || echo '[]')
            n=$(printf '%s' "$tags" | jq 'length'); [ "$n" -eq 0 ] && break
            names="$names $(printf '%s' "$tags" | jq -r --arg keep "$keep" '.[] | select(.name != $keep) | .name')"
            page=$((page+1))
          done
          for name in $names; do
            echo "  delete tag $name"
            curl -fsS -X DELETE "${auth[@]}" "${api}/git/refs/tags/${name}" || echo "    (tag $name delete failed; continuing)"
          done
          echo "Public reset done; kept ${keep}."

      - name: Cleanup workspace
        if: always()
        run: |
          rm -rf Jellyfin.Plugin.JellyCrowd/bin Jellyfin.Plugin.JellyCrowd/obj \
                 Jellyfin.Plugin.JellyCrowd.Tests/bin Jellyfin.Plugin.JellyCrowd.Tests/obj \
                 artifacts
          rm -rf "${RUNNER_TEMP}/dist-repo" || true
          # `dotnet nuget locals` takes a single location at a time; clear each separately (keep
          # global-packages so restores stay warm).
          dotnet nuget locals http-cache --clear || true
          dotnet nuget locals temp --clear || true
