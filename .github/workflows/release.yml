name: Release

# Automatic 4-part versioning (major.minor.patch.revision) driven by a keyword in the commit message:
#   [major]    / #major                   -> bump MAJOR    (x+1.0.0.0)
#   [minor]    / #minor                    -> bump MINOR    (x.y+1.0.0)
#   [revision] / #revision / [hotfix] / [build] -> bump REVISION (x.y.z.w+1) — stay on the x.y.z line
#   anything else                          -> bump PATCH    (x.y.z+1.0)
# Skip a release entirely with [skip release] in the commit message.
#
# Source, distribution and documentation all live in THIS repository. `manifest.json` at the root is the
# install URL configured in every user's Jellyfin — it is updated in place, in the same commit as the
# version stamp, and must never move or be rewritten from scratch.

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: JellyCrowd

jobs:
  release:
    name: Version & Release
    # GitHub-hosted, like CI: free and unmetered on a public repository, and nothing here needs a machine
    # that persists. It also means no workflow merged into `main` can ever reach a personal host.
    runs-on: ubuntu-latest
    # The owner guard matters on a public, forkable repository: a fork inherits the workflow file, and
    # this job pushes tags, commits and cuts releases. It must only ever run here.
    if: >-
      ${{ github.repository_owner == 'LokLakh-s'
          && !startsWith(github.event.head_commit.message, 'chore(release):')
          && !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Both: the plugin and its 10.11 companion are net9.0, while the Jellyfin 12 companion must be
          # net10.0 (Jellyfin.Controller 12.x ships lib/net10.0 only). The net9 SDK stays listed because the
          # test host runs on net9.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Determine next version
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Explicit override: [version=X.Y.Z.W] pins the exact version and bypasses the tag-based bump.
          # Everything downstream (tag, stamp, manifest) uses it verbatim.
          # `|| true`: grep exits non-zero when there's no [version=] tag, which would abort the step
          # under `set -euo pipefail` and fail every normal (non-override) release.
          override=$(printf '%s' "$COMMIT_MSG" | grep -oiE '\[version=[0-9.]+\]' | head -n1 | tr -dc '0-9.' || true)
          if [ -n "$override" ]; then
            version="$override"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
            if [ -z "$latest" ]; then base="0.1.0.0"; else base="${latest#v}"; fi
            IFS='.' read -r major minor patch revision <<< "$base"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}; revision=${revision:-0}
            if printf '%s' "$COMMIT_MSG" | grep -qiE '\[major\]|#major'; then
              major=$((major+1)); minor=0; patch=0; revision=0
            elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[minor\]|#minor'; then
              minor=$((minor+1)); patch=0; revision=0
            elif printf '%s' "$COMMIT_MSG" | grep -qiE '\[revision\]|#revision|\[hotfix\]|\[build\]'; then
              revision=$((revision+1))
            else
              patch=$((patch+1)); revision=0
            fi
            version="${major}.${minor}.${patch}.${revision}"
          fi
          echo "version=$version"   >> "$GITHUB_OUTPUT"
          echo "assembly=$version"  >> "$GITHUB_OUTPUT"
          echo "tag=v$version"      >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Abort if tag already exists
        run: |
          if git rev-parse "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.bump.outputs.tag }} already exists."; exit 1
          fi

      - name: Stamp version into source files
        run: |
          set -euo pipefail
          asm="${{ steps.bump.outputs.assembly }}"
          sed -i -E "s|<Version>[^<]*</Version>|<Version>${asm}</Version>|" Directory.Build.props
          sed -i -E "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>${asm}</AssemblyVersion>|" Directory.Build.props
          sed -i -E "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>${asm}</FileVersion>|" Directory.Build.props
          sed -i -E "s|^version: .*|version: \"${asm}\"|" build.yaml

      - name: Restore, build & test
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build --verbosity normal
          (cd tests/js && npm ci)
          node --test tests/js/*.test.js

      - name: Package plugin
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/*.dll artifacts/
          # The isolated Skip Outro companion ships as lib/*.dll.bin — BOTH halves, one built against the
          # 10.11 SDK and one against 12.x; the plugin loads whichever one the running host can. Jellyfin
          # loads every "*.dll" it finds under the plugin folder, and each half throws on the other's major,
          # which would disable the WHOLE plugin. Neither defence that looks sufficient is: meta.json's
          # "assemblies" allowlist is rewritten to [] by a manifest install, and the walk is recursive, so a
          # plain subfolder is scanned too. Only the extension takes them out of the glob.
          mkdir -p artifacts/lib
          cp Jellyfin.Plugin.JellyCrowd/bin/Release/net9.0/lib/*.dll.bin artifacts/lib/
          cp build.yaml artifacts/
          zipname="jelly-crowd-${{ steps.bump.outputs.tag }}.zip"
          (cd artifacts && zip "$zipname" *.dll build.yaml lib/*.bin && md5sum "$zipname" > "$zipname.md5")

      # The manifest is updated BEFORE the release exists, because both fields it needs are deterministic:
      # the checksum comes from the zip we just built, and the download URL from the tag we are about to
      # push. That keeps the version stamp and the manifest entry in one commit, which is what makes the
      # published history readable — one commit per version, and nothing to reconcile afterwards.
      - name: Update the install manifest
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tag="${{ steps.bump.outputs.tag }}"
          asm="${{ steps.bump.outputs.assembly }}"
          guid="a1994160-4ea2-4d81-bd3c-ffe825700d98"
          zipname="jelly-crowd-${tag}.zip"
          checksum=$(md5sum "JellyCrowd/artifacts/${zipname}" | cut -d' ' -f1)
          sourceUrl="https://github.com/${{ github.repository }}/releases/download/${tag}/${zipname}"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.0000000Z)
          entry=$(jq -n \
            --arg v "$asm" \
            --arg c "Release ${tag}" \
            --arg abi "10.11.0.0" \
            --arg url "$sourceUrl" \
            --arg sum "$checksum" \
            --arg ts "$timestamp" \
            '{version: $v, changelog: $c, targetAbi: $abi, sourceUrl: $url, checksum: $sum, timestamp: $ts}')
          # Newest first, three kept: a Jellyfin server offers the newest entry it can run, and the two
          # behind it are what a rollback needs. Their releases stay published, so their URLs keep working.
          jq --argjson e "$entry" --arg guid "$guid" \
            'map(if .guid == $guid then .versions = (([$e] + (.versions // [])) | .[0:3]) else . end)' \
            manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          jq -e --arg v "$asm" '.[0].versions[0].version == $v' manifest.json >/dev/null \
            || { echo "::error::manifest.json did not take the new entry"; exit 1; }

      - name: Commit version bump and tag
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JellyCrowd/Directory.Build.props JellyCrowd/build.yaml manifest.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          # Annotated tag + explicit push: the version counter (git tag --list) lives in this repo, and
          # `--follow-tags` only pushes annotated tags — a lightweight tag would never reach the remote,
          # leaving the next run to recompute the same version and fail on an empty bump commit.
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}"

      - name: Publish the GitHub release
        # Pinned to a commit, not a tag: a moving tag on a third-party action is a supply-chain hand-off.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          files: |
            JellyCrowd/artifacts/jelly-crowd-*.zip
            JellyCrowd/artifacts/jelly-crowd-*.zip.md5
