# Jelly Crowd — local test stack against Jellyfin 12.1 (stable).
#
# Purpose: validate compatibility with the reworked 12.x web UI. Brings up Jellyfin 12.1 plus
# the Servarr backends Jelly Crowd dispatches to (Radarr = movies, Sonarr = shows, Prowlarr = indexers).
#
# Quick start (from this folder):
#   1) pwsh ./deploy-plugin.ps1        # builds Jelly Crowd (Release) into ./jellyfin/config/plugins/JellyCrowd
#   2) docker compose up -d
#   3) http://localhost:8096           # finish the Jellyfin setup wizard
#   4) In Jelly Crowd config: TMDB key + connect Radarr (http://radarr:7878) / Sonarr (http://sonarr:8989).
#
# The Jellyfin image tag is pinned to 12.1 for reproducibility; `unstable` / `preview` also exist if
# you want the very latest nightly.

services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellycrowd-jellyfin
    # Run as the host user: the deploy script writes ./jellyfin*/config/plugins from the host,
    # and the official image would otherwise create those trees as root.
    user: "1000:1000"
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin/config:/config        # plugins live here: /config/plugins/JellyCrowd (deploy script writes it)
      - ./jellyfin/cache:/cache
      - ./media:/media
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped

  # Backward-compat check: the SAME source must keep working on Jellyfin 10.11 (prod stays here).
  # http://localhost:8097 — verify the header/overlay still inject and the whole UI still works.
  jellyfin-1011:
    image: jellyfin/jellyfin:10.11
    container_name: jellycrowd-jellyfin-1011
    # Run as the host user: the deploy script writes ./jellyfin*/config/plugins from the host,
    # and the official image would otherwise create those trees as root.
    user: "1000:1000"
    ports:
      - "8097:8096"
    volumes:
      - ./jellyfin-1011/config:/config   # deploy script writes /config/plugins/JellyCrowd here too
      - ./jellyfin-1011/cache:/cache
      - ./media:/media
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: jellycrowd-radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./radarr/config:/config
      - ./media:/media
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: jellycrowd-sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./sonarr/config:/config
      - ./media:/media
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: jellycrowd-prowlarr
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./prowlarr/config:/config
    restart: unless-stopped
