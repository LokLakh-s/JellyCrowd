<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Guide d’utilisation JellyCrowd — Keeklah.tv">
<meta name="color-scheme" content="light dark">
</head>
<body>

<title>Guide JellyCrowd — Keeklah.tv</title>
<style>
  :root{
    --bg:#0c110e;--panel:#141b17;--panel-2:#1a221d;--border:#2a332d;
    --ink:#e9efea;--muted:#93a49a;--faint:#6f7e75;
    --accent:#37bd60;--accent-ink:#08120b;--accent-soft:#153021;
    --s-blue:#4aa3e6;--s-amber:#e2a412;--s-purple:#9384f4;--s-green:#37bd60;--s-grey:#7c8a82;
    --shadow:0 18px 44px -22px rgba(0,0,0,.65);--maxw:940px;
  }
  @media (prefers-color-scheme: light){:root{
    --bg:#ecf0ec;--panel:#fff;--panel-2:#f4f7f3;--border:#dde4dd;
    --ink:#18211c;--muted:#586459;--faint:#8a968c;
    --accent:#1d9a4a;--accent-ink:#fff;--accent-soft:#e6f4ea;
    --s-blue:#2b7fc4;--s-amber:#b8790a;--s-purple:#6f5fe0;--s-green:#1d9a4a;--s-grey:#6a776e;
    --shadow:0 16px 40px -24px rgba(20,40,28,.35);
  }}
  :root[data-theme="light"]{
    --bg:#ecf0ec;--panel:#fff;--panel-2:#f4f7f3;--border:#dde4dd;
    --ink:#18211c;--muted:#586459;--faint:#8a968c;
    --accent:#1d9a4a;--accent-ink:#fff;--accent-soft:#e6f4ea;
    --s-blue:#2b7fc4;--s-amber:#b8790a;--s-purple:#6f5fe0;--s-green:#1d9a4a;--s-grey:#6a776e;
    --shadow:0 16px 40px -24px rgba(20,40,28,.35);
  }
  :root[data-theme="dark"]{
    --bg:#0c110e;--panel:#141b17;--panel-2:#1a221d;--border:#2a332d;
    --ink:#e9efea;--muted:#93a49a;--faint:#6f7e75;
    --accent:#37bd60;--accent-ink:#08120b;--accent-soft:#153021;
    --s-blue:#4aa3e6;--s-amber:#e2a412;--s-purple:#9384f4;--s-green:#37bd60;--s-grey:#7c8a82;
    --shadow:0 18px 44px -22px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
  a{color:var(--accent);}

  .langbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .langbar .wrap{display:flex;align-items:center;justify-content:flex-end;height:48px;}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--panel);}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.82rem;font-weight:700;letter-spacing:.03em;padding:.34em .8em;cursor:pointer;}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);}

  header.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border);
    background:radial-gradient(120% 90% at 85% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),linear-gradient(180deg,var(--panel-2),var(--bg));}
  .hero .wrap{padding-top:48px;padding-bottom:40px;}
  .kicker{display:inline-flex;align-items:center;gap:.55em;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));background:var(--accent-soft);padding:.4em .8em;border-radius:999px;}
  h1{font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;margin:.55em 0 .25em;letter-spacing:-.02em;text-wrap:balance;font-weight:800;}
  .lede{font-size:1.12rem;color:var(--muted);max-width:39em;text-wrap:pretty;}
  .where{margin-top:20px;font-size:.98rem;color:var(--muted);max-width:44em;border-left:3px solid var(--accent);background:var(--panel-2);padding:12px 16px;border-radius:0 10px 10px 0;}

  main{padding:8px 0 40px;}
  .step{padding:38px 0 6px;border-top:1px solid var(--border);}
  .step:first-of-type{border-top:0;}
  .step-head{display:flex;gap:16px;align-items:flex-start;}
  .num{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent);}
  .step h2{font-size:1.42rem;margin:.1em 0 .15em;letter-spacing:-.01em;}
  .step-head p{margin:0;color:var(--muted);max-width:44em;}
  .body{margin-top:16px;}
  .body>p{max-width:46em;}
  ul.clean{margin:.4em 0 0;padding-left:1.15em;color:var(--muted);}
  ul.clean li{margin:.3em 0;}
  ul.clean b,.body b{color:var(--ink);font-weight:600;}

  figure{margin:22px 0 6px;}
  .shot{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);}
  .shot.narrow{max-width:430px;}
  .shot img{display:block;width:100%;height:auto;}
  figcaption{margin-top:10px;font-size:.86rem;color:var(--faint);text-align:center;}

  .callout{margin:22px 0 4px;display:flex;gap:12px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:14px 16px;}
  .callout .ic{font-size:1.05rem;line-height:1.5;}
  .callout p{margin:0;font-size:.96rem;color:var(--muted);}

  .legend-sec,.quota-sec,.faq-sec{padding:38px 0 8px;border-top:1px solid var(--border);}
  h2.sec{font-size:1.42rem;margin:0 0 4px;}
  .sec-intro{color:var(--muted);margin:.15em 0 20px;max-width:46em;}
  .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;}
  .lg{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 15px;}
  .pill{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;padding:.24em .7em;border-radius:7px;}
  .lg p{margin:.6em 0 0;font-size:.9rem;color:var(--muted);}
  .p-blue{background:var(--s-blue);}.p-amber{background:var(--s-amber);}.p-purple{background:var(--s-purple);}.p-green{background:var(--s-green);}.p-grey{background:var(--s-grey);}

  .qbar-demo{margin:16px 0 6px;max-width:520px;}
  .qbar-label{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px;}
  .qbar{height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--border);overflow:hidden;}
  .qbar>span{display:block;height:100%;width:38%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--s-blue)));}

  details{border:1px solid var(--border);border-radius:11px;background:var(--panel);padding:2px 16px;margin:10px 0;}
  details[open]{background:var(--panel-2);}
  summary{cursor:pointer;padding:13px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"+";color:var(--accent);font-weight:800;font-size:1.2rem;}
  details[open] summary::after{content:"–";}
  details p{margin:0 0 14px;color:var(--muted);font-size:.96rem;}

  footer{border-top:1px solid var(--border);color:var(--faint);font-size:.86rem;}
  footer .wrap{padding:22px 20px 40px;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  @media (max-width:560px){.num{width:32px;height:32px;}}
</style>

<div class="langbar"><div class="wrap">
  <div class="seg" role="group" aria-label="Language">
    <button type="button" data-lang="fr" aria-pressed="true">FR</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
</div></div>

<div id="app"></div>

<script src="guide.js"></script>

</body>
</html>
