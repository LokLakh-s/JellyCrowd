<!--
  Jelly Crowd releases calendar. Served by WebController and loaded by header.js into the overlay.
  Must be a fragment (no <html>/<head>/<body>) and reference assets via absolute URLs (ApiClient.getUrl).
-->
<div id="jellyCrowdCalendar" class="jellycrowd">
  <header class="jellycrowd-header">
    <div class="jellycrowd-brand">
      <img id="jcCalLogo" class="jellycrowd-logo" alt="" />
      <h1 id="jcCalTitle" class="jellycrowd-title">Calendar</h1>
    </div>
    <div class="jellycrowd-cal-nav">
      <button type="button" id="jcCalPrev" class="jellycrowd-chip" aria-label="Previous month">‹</button>
      <span id="jcCalMonth" class="jellycrowd-cal-month"></span>
      <button type="button" id="jcCalNext" class="jellycrowd-chip" aria-label="Next month">›</button>
      <button type="button" id="jcCalToday" class="jellycrowd-chip"></button>
      <select id="jcCalLang" class="jellycrowd-cal-filter"></select>
      <select id="jcCalCountry" class="jellycrowd-cal-filter"></select>
    </div>
  </header>

  <p id="jcCalMessage" class="jellycrowd-message" hidden></p>
  <div id="jcCalGrid" class="jellycrowd-cal-grid" aria-live="polite"></div>
</div>

<script>
  (function () {
    var get = (window.ApiClient && window.ApiClient.getUrl)
      ? function (p) { return window.ApiClient.getUrl(p); }
      : function (p) { return '/' + p; };

    if (!document.getElementById('jellycrowd-css')) {
      var css = document.createElement('link');
      css.id = 'jellycrowd-css';
      css.rel = 'stylesheet';
      css.href = get('JellyCrowd/Web/jellycrowd.css');
      document.head.appendChild(css);
    }

    function start() {
      var s = document.createElement('script');
      s.src = get('JellyCrowd/Web/calendar.js');
      document.head.appendChild(s);
    }

    if (window.JellyCrowdLib) {
      start();
    } else {
      var lib = document.createElement('script');
      lib.src = get('JellyCrowd/Web/catalog.lib.js');
      lib.onload = start;
      document.head.appendChild(lib);
    }
  })();
</script>
