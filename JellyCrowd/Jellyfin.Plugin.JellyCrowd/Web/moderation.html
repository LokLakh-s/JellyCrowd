<!--
  Jelly Crowd "Moderation" page (admin only). Fetched and injected as a fragment like the other views,
  so it carries no <html>/<head>/<body> and loads its assets via absolute URLs.
-->
<div id="jellyCrowdModeration" class="jellycrowd">
  <header class="jellycrowd-header">
    <div class="jellycrowd-brand">
      <img id="jcModLogo" class="jellycrowd-logo" alt="" />
      <h1 id="jcModTitle" class="jellycrowd-title"></h1>
    </div>
  </header>
  <p id="jcModSubtitle" class="jellycrowd-disclaimer"></p>
  <section class="jellycrowd-section">
    <p id="jcModMessage" class="jellycrowd-message" hidden></p>
    <div id="jcModList" class="jellycrowd-list" aria-live="polite"></div>
  </section>
</div>

<script>
  (function () {
    var get = (window.ApiClient && window.ApiClient.getUrl)
      ? function (p) { return window.ApiClient.getUrl(p); }
      : function (p) { return '/' + p; };

    if (!document.getElementById('jellycrowd-css')) {
      var css = document.createElement('link');
      css.id = 'jellycrowd-css';
      css.rel = 'stylesheet';
      css.href = get('JellyCrowd/Web/jellycrowd.css');
      document.head.appendChild(css);
    }

    function start() {
      var s = document.createElement('script');
      s.src = get('JellyCrowd/Web/moderation.js');
      document.head.appendChild(s);
    }

    if (window.JellyCrowdLib) {
      start();
    } else {
      var lib = document.createElement('script');
      lib.src = get('JellyCrowd/Web/catalog.lib.js');
      lib.onload = start;
      document.head.appendChild(lib);
    }
  })();
</script>
