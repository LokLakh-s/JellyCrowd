<!--
  Jelly Crowd "Guide" view: the user guide, hosted by the plugin (no external site, no SSO) and shown in
  an overlay panel. It is a self-contained page (guide-page.html + guide.js) rendered in a same-origin
  iframe so its own styles/theme stay isolated from the Jellyfin UI.
-->
<div class="jellycrowd jellycrowd-guide-view">
  <iframe id="jcGuideFrame" title="Guide" loading="lazy"
    style="display:block;width:100%;height:82vh;border:0;border-radius:10px;background:transparent;"></iframe>
</div>
<script>
  (function () {
    var f = document.getElementById('jcGuideFrame');
    if (!f) { return; }
    var get = (window.ApiClient && typeof window.ApiClient.getUrl === 'function')
      ? function (p) { return window.ApiClient.getUrl(p); }
      : function (p) { return '/' + p; };
    // Same-origin (plugin-served) → no X-Frame-Options / CSP issue, unlike the external keeklah.fr page.
    f.src = get('JellyCrowd/Web/guide-page.html');
  })();
</script>
