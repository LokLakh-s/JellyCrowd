<!--
  Jelly Crowd "Dashboard" page — a per-user profile with their Jellyfin viewing stats, request activity
  and quota. Fetched and injected as a fragment like the other views; assets load via absolute URLs.
-->
<div id="jellyCrowdDashboard" class="jellycrowd">
  <header class="jellycrowd-header">
    <div class="jellycrowd-brand">
      <img id="jcDashLogo" class="jellycrowd-logo" alt="" />
      <h1 id="jcDashTitle" class="jellycrowd-title"></h1>
    </div>
  </header>
  <section class="jellycrowd-section">
    <p id="jcDashMessage" class="jellycrowd-message" hidden></p>
    <div id="jcDashContent" aria-live="polite"></div>
  </section>
</div>

<script>
  (function () {
    var get = (window.ApiClient && window.ApiClient.getUrl)
      ? function (p) { return window.ApiClient.getUrl(p); }
      : function (p) { return '/' + p; };

    if (!document.getElementById('jellycrowd-css')) {
      var css = document.createElement('link');
      css.id = 'jellycrowd-css';
      css.rel = 'stylesheet';
      css.href = get('JellyCrowd/Web/jellycrowd.css');
      document.head.appendChild(css);
    }

    function start() {
      var s = document.createElement('script');
      s.src = get('JellyCrowd/Web/dashboard.js');
      document.head.appendChild(s);
    }

    if (window.JellyCrowdLib) {
      start();
    } else {
      var lib = document.createElement('script');
      lib.src = get('JellyCrowd/Web/catalog.lib.js');
      lib.onload = start;
      document.head.appendChild(lib);
    }
  })();
</script>
