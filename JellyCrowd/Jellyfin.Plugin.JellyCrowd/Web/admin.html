<!--
  Jelly Crowd "Admin" overlay (admin only). A self-designed admin area hosted by the plugin, opened from
  the admin-only navbar entry. Fetched and injected as a fragment like the other views.
-->
<div id="jellyCrowdAdmin" class="jellycrowd">
  <header class="jellycrowd-header">
    <div class="jellycrowd-brand">
      <img id="jcAdminLogo" class="jellycrowd-logo" alt="" />
      <h1 id="jcAdminTitle" class="jellycrowd-title"></h1>
    </div>
  </header>
  <div id="jcAdminTabs" class="jellycrowd-admin-tabbar" role="tablist"></div>
  <section class="jellycrowd-section">
    <p id="jcAdminMessage" class="jellycrowd-message" hidden></p>
    <div id="jcAdminContent" aria-live="polite"></div>
  </section>
</div>

<script>
  (function () {
    var get = (window.ApiClient && window.ApiClient.getUrl)
      ? function (p) { return window.ApiClient.getUrl(p); }
      : function (p) { return '/' + p; };

    if (!document.getElementById('jellycrowd-css')) {
      var css = document.createElement('link');
      css.id = 'jellycrowd-css';
      css.rel = 'stylesheet';
      css.href = get('JellyCrowd/Web/jellycrowd.css');
      document.head.appendChild(css);
    }

    function start() {
      var s = document.createElement('script');
      s.src = get('JellyCrowd/Web/admin.js');
      document.head.appendChild(s);
    }

    if (window.JellyCrowdLib) {
      start();
    } else {
      var lib = document.createElement('script');
      lib.src = get('JellyCrowd/Web/catalog.lib.js');
      lib.onload = start;
      document.head.appendChild(lib);
    }
  })();
</script>
